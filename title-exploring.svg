<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="64" viewBox="0 0 1050 64" role="img" aria-label="Currently Exploring">
  <title>Currently Exploring</title>
  <style>
    .t { font-family: Consolas, Monaco, 'Courier New', monospace; }
    .title { font-size: 22px; font-weight: bold; letter-spacing: 1px; fill: #a9c9ff; }
    .note { font-size: 14px; fill: #5d729f; }
    .cursor { fill: #82b4ff; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* the icon and the line under the header draw themselves once, when the page loads */
    .draw { fill: none; stroke: #5b8def; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease-out forwards; }
    .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .5s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rule { fill: none; stroke: #5b8def; stroke-width: 2; stroke-linecap: round; opacity: .45;
             stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s .3s ease-out forwards; }
    /* the compass needle swings gently, like it is still finding north */
    .needle { transform-origin: 36px 32px; animation: swing 4s ease-in-out 1.2s infinite alternate; }
    @keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  </style>

  <rect x=".5" y=".5" width="1049" height="63" rx="10" fill="#0a1430" stroke="#1b2d63"/>
  <rect x="14" y="10" width="44" height="44" rx="10" fill="#101e47" stroke="#1b2d63"/>
  <g transform="translate(18,14) scale(1.5)">
    <circle class="draw" cx="12" cy="12" r="9.5" pathLength="1"/>
    <path class="draw d2" d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2" pathLength="1"/>
    <g class="needle"><path class="draw d3" d="M15.8 8.2l-2.3 5.3-5.3 2.3 2.3-5.3z" pathLength="1"/></g>
  </g>
  <text x="76" y="39" class="t title">Currently Exploring <tspan class="cursor">_</tspan></text>
  <text x="1032" y="38" class="t note" text-anchor="end">// learning and trying next</text>
  <path class="rule" d="M76 57H1032" pathLength="1"/>
</svg>
