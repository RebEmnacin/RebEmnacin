<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="64" viewBox="0 0 1050 64" role="img" aria-label="Tech Stack">
  <title>Tech Stack</title>
  <style>
    .t { font-family: Consolas, Monaco, 'Courier New', monospace; }
    .title { font-size: 22px; font-weight: bold; letter-spacing: 1px; fill: #a9c9ff; }
    .note { font-size: 14px; fill: #5d729f; }

    /* the icon and the line under the header draw themselves once, when the page loads */
    .draw { fill: none; stroke: #5b8def; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease-out forwards; }
    .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .5s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rule { fill: none; stroke: #5b8def; stroke-width: 2; stroke-linecap: round; opacity: .45;
             stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s .3s ease-out forwards; }
    /* the three layers float up and down one after another, like a stack being built */
    .lay { animation: float 3s ease-in-out 1.2s infinite alternate; }
    .l2 { animation-delay: 1.4s; } .l3 { animation-delay: 1.6s; }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
  
    @media (prefers-color-scheme: light) {
      .title { fill: #2557b8; } .note { fill: #6a7aa0; }
      .draw, .rule { stroke: #2f6bdc; }
      [fill="#5b8def"]{fill:#2f6bdc}
      [stroke="#1b2d63"]{stroke:#c5d1ee}
    }
  </style>

  <rect x=".5" y=".5" width="1049" height="63" rx="10" fill="none" stroke="#1b2d63"/>
  <rect x="14" y="10" width="44" height="44" rx="10" fill="#5b8def" fill-opacity=".1" stroke="#1b2d63"/>
  <g transform="translate(18,14) scale(1.5)">
    <g class="lay l3"><path class="draw d3" d="M3 16.5l9 5 9-5" pathLength="1"/></g>
    <g class="lay l2"><path class="draw d2" d="M3 12l9 5 9-5" pathLength="1"/></g>
    <g class="lay"><path class="draw" d="M12 2.5l9 5-9 5-9-5z" pathLength="1"/></g>
  </g>
  <text x="76" y="39" class="t title">Tech Stack</text>
  <text x="1032" y="38" class="t note" text-anchor="end">// languages I build with</text>
  <path class="rule" d="M76 57H1032" pathLength="1"/>
</svg>
