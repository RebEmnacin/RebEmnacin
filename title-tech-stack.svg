<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="44" viewBox="0 0 1050 44">
  <style>
    .title {
      font-family: Consolas, Monaco, 'Courier New', monospace; /* font stack, see note below */
      font-size: 20px;
      font-weight: bold;      /* normal, bold, 100-900 */
      letter-spacing: 1px;    /* 0, 1px, 2px, etc. */
      fill: #61afef;          /* text color (same as your "- Contact -" blue) */
    }
    .cursor {
      fill: #e5c07b;          /* same yellow as your greeting */
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }  /* remove this line + the animation line to stop blinking */
  </style>

  <rect width="1050" height="44" rx="8" fill="#0b0e14" stroke="#1f2430" stroke-width="1"/>
  <text x="20" y="29" class="title">- Tech Stack - <tspan class="cursor">_</tspan></text>
</svg>
